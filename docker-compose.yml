services:
  put-port-on-desktop:
    build:
      context: .
      dockerfile: Dockerfile
    image: put-port-on-desktop:latest
    container_name: put-port-on-desktop
    restart: unless-stopped
    # Share host network and PID namespace to monitor host sockets and bind proxy ports dynamically
    network_mode: "host"
    pid: "host"
    privileged: true
    volumes:
      - /:/host/root:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
