name: Build fnOS fpk Package

on:
  push:
    branches:
      - master
      - main
      - 'dev_*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            platform: x86
            suffix: x86
          - goarch: arm64
            platform: arm
            suffix: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Update manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version.*=.*/version      = ${VERSION}/" fnos-app/manifest
          echo "Updated manifest version to ${VERSION}"

      - name: Set manifest platform
        run: |
          if [ "${{ matrix.platform }}" = "arm" ]; then
            sed -i '/^arch.*=.*/d' fnos-app/manifest
          fi
          sed -i "s/^platform.*=.*/platform        = ${{ matrix.platform }}/" fnos-app/manifest
          cat fnos-app/manifest

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o fnos-app/app/put-port-on-desktop ./cmd/server
          chmod +x fnos-app/app/put-port-on-desktop
          chmod +x fnos-app/cmd/*

      - name: Download fnpack
        continue-on-error: true
        id: fnpack-dl
        run: |
          curl -L -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.0-linux-amd64 || true
          if [ -s /tmp/fnpack ]; then
            chmod +x /tmp/fnpack
            echo "has_fnpack=true" >> $GITHUB_OUTPUT
          else
            echo "has_fnpack=false" >> $GITHUB_OUTPUT
          fi

      - name: Build fpk package
        run: |
          cd fnos-app
          if [ "${{ steps.fnpack-dl.outputs.has_fnpack }}" = "true" ]; then
            /tmp/fnpack build
            mv put-port-on-desktop.fpk ../put-port-on-desktop-${{ matrix.suffix }}.fpk
          else
            echo "Using standard fnOS fpk archive packaging..."
            tar -czvf ../put-port-on-desktop-${{ matrix.suffix }}.fpk manifest ICON.PNG ICON_256.PNG app cmd config wizard
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: put-port-on-desktop-${{ matrix.suffix }}-package
          path: put-port-on-desktop-${{ matrix.suffix }}.fpk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            put-port-on-desktop-x86.fpk
            put-port-on-desktop-arm.fpk
          generate_release_notes: true
