name: Build fnOS fpk Package

on:
  push:
    branches:
      - master
      - main
      - 'dev_*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            platform: x86
            suffix: x86
          - goarch: arm64
            platform: arm
            suffix: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Update manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version.*=.*/version      = ${VERSION}/" fnos-app/manifest
          echo "Updated manifest version to ${VERSION}"

      - name: Set manifest platform
        run: |
          if [ "${{ matrix.platform }}" = "arm" ]; then
            sed -i '/^arch.*=.*/d' fnos-app/manifest
          fi
          sed -i "s/^platform.*=.*/platform        = ${{ matrix.platform }}/" fnos-app/manifest
          cat fnos-app/manifest

      - name: Try download official fnpack
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.0-linux-amd64 || true
          if [ -s /tmp/fnpack ]; then
            chmod +x /tmp/fnpack
          fi

      - name: Install Pillow for icon generation
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages Pillow || pip3 install Pillow || true

      - name: Build fpk package
        run: |
          chmod +x ./scripts/build-fpk.sh
          ./scripts/build-fpk.sh ${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-docker-to-desktop-${{ matrix.suffix }}-package
          path: fn-docker-to-desktop-${{ matrix.suffix }}.fpk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine tag, release name, and release notes
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "release_name=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            TAG_NAME="latest"
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Build (master)" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          python3 -c "
import re, os
tag = '${TAG_NAME}'
notes = ''
if os.path.exists('docs/CONVERSATION_HISTORY.md'):
    with open('docs/CONVERSATION_HISTORY.md', 'r', encoding='utf-8') as f:
        content = f.read()
    pattern = rf'## Turn \d+ - {re.escape(tag)} 发布记录([\s\S]*?)(?=\n---\n\n## Turn|\Z)'
    m = re.search(pattern, content)
    if not m:
        matches = list(re.finditer(r'## Turn \d+ - (v[0-9.]+) 发布记录([\s\S]*?)(?=\n---\n\n## Turn|\Z)', content))
        if matches:
            m = matches[-1]
    if m:
        notes = m.group(1).strip()

with open('release_notes.md', 'w', encoding='utf-8') as out:
    if notes:
        out.write(notes + '\n')
    else:
        out.write('版本更新与系统优化\n')
"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body_path: release_notes.md
          prerelease: ${{ steps.vars.outputs.prerelease == 'true' }}
          files: |
            fn-docker-to-desktop-x86.fpk
            fn-docker-to-desktop-arm.fpk
          generate_release_notes: true


