name: Build fnOS fpk Package

on:
  push:
    branches:
      - master
      - main
      - 'dev_*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            platform: x86
            suffix: x86
          - goarch: arm64
            platform: arm
            suffix: arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Update manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version.*=.*/version      = ${VERSION}/" fnos-app/manifest
          echo "Updated manifest version to ${VERSION}"

      - name: Set manifest platform
        run: |
          if [ "${{ matrix.platform }}" = "arm" ]; then
            sed -i '/^arch.*=.*/d' fnos-app/manifest
          fi
          sed -i "s/^platform.*=.*/platform        = ${{ matrix.platform }}/" fnos-app/manifest
          cat fnos-app/manifest

      - name: Try download official fnpack
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.0-linux-amd64 || true
          if [ -s /tmp/fnpack ]; then
            chmod +x /tmp/fnpack
          fi

      - name: Build fpk package
        run: |
          chmod +x ./scripts/build-fpk.sh
          ./scripts/build-fpk.sh ${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fn-docker-to-desktop-${{ matrix.suffix }}-package
          path: fn-docker-to-desktop-${{ matrix.suffix }}.fpk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fn-docker-to-desktop-x86.fpk
            fn-docker-to-desktop-arm.fpk
          generate_release_notes: true

